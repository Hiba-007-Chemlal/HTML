<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="bootstrap.css">
  <title>Document</title>
  <style>
    .box {
      font-size:30px;
      background: pink;
      padding: 20px;
      text-align: center;
    }
    .container {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap:10px;
    }
    .box1 {
      grid-column: 1/4;
      grid-row-start:1;
      grid-row-end:3;
    }
    .box2 {
      grid-column: 1/3;
    }
    .hiba {
      background: violet;
      margin-top: 30px;
      font-size: 30px;
      position:sticky;
      top:0;
    }
 

.text {
    position: absolute;
    translate:(-50%, -50%);
}
  </style>
</head>
<body>
  <div class="container">
    <div class="box box1"> 1 </div>
    <div class="box box2"> 2 </div>
    <div class="box box3"> 3 </div>
    <div class="box box4"> 4 </div>
    <div class="box box5"> 5 </div>
    <div class="box box6"> 6 </div>
    <div class="box box7"> 7 </div>
    <div class="box box8"> 8 </div>
    <div class="box box9"> 9 </div>
    <div class="box box10"> 10 </div>
    <div class="box box11"> 11 </div>
    <div class="box box12"> 12 </div>
  </div>
  <div>
    <div class="hiba"> Hiba </div>
  </div>  
  <p class="fas fa-home"> hh</p>

    <div class="card-body"> hhhh </div>
  </div>

   <label>

</div>

</div>

</html>
