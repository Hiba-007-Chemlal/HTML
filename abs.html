<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>position absolute</title>
<style>
    .container {
  position: relative;
  width: 300px;
  height: 180px;
  background: #eaeaea;
  padding: 15px;
  border: 2px solid #999;
}

.box {
  position: absolute;      
  top: 15px;               
  right: 20px;            
  background: #ff5555;
  color: white;
  padding: 8px 12px;
  border-radius: 5px;
  
}

</style>
</head>
<body>
    <div class="container">
  <p>Bonjour</p>
  <div class="box">position Absolute</div>
</div>

</body>
</html>
