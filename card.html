<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Formulaire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="bootstrap.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow">
    <div class="card-header text-center bg-white">
      <h4>Enregistrer un nouvel apprenant</h4>
    </div>

    <div class="card-body">
      <form class="row g-3 needs-validation" novalidate>

        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Votre identifiant" required>
        </div>

        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Votre prénom" required>
        </div>

        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Votre nom" required>
        </div>

        <div class="col-md-4">
          <input type="email" class="form-control" placeholder="Email@gmail.com" required>
        </div>

        <div class="col-md-4">
          <input type="date" class="form-control" required>
        </div>

        <div class="col-md-4">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="sexe" required>
            <label class="form-check-label">Homme</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="sexe" required>
            <label class="form-check-label">Femme</label>
          </div>
        </div>

        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Saisir votre adresse" required>
        </div>

        <div class="col-md-6">
          <select class="form-select" required>
            <option value="">Liste déroulante (gouvernorat)</option>
            <option>Rabat</option>
            <option>Casablanca</option>
            <option>Fès</option>
            <option>Marrakech</option>
          </select>
        </div>

        <div class="col-md-6">
          <input type="password" class="form-control" placeholder="Mot de passe" required>
        </div>

        <div class="col-md-6">
          <select class="form-select" required>
            <option value="">Liste déroulante (groupe)</option>
            <option>Groupe A</option>
            <option>Groupe B</option>
            <option>Groupe C</option>
          </select>
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <button class="btn btn-primary px-5" type="submit">Envoyer</button>
          <button class="btn btn-danger px-5" type="reset">Effacer</button>
        </div>

      </form>
    </div>
  </div>
</div>

</body>
</html>
