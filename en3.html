<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Positionnement flottant </title>
    <style>
        div {
            border: 1px solid rgba(0,0,0,.3);
            text-align: center;
            color: #fff;
            display: flex;
        }
        .box {
            
            background: #3498db;
            padding: 5px;
            height: 40px;
            margin-right: 10px;
        }
        .conteneur {
            overflow-block: auto;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="conteneur">
        <div class="box"> block2 </div>
        <div class="box"> block3 </div>
        <div class="box"> block4 </div>
    </div>
</body>
</html>
