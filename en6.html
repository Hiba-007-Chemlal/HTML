<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title> en6 </title>
</head>
<body>
    <div class="form-container">
        <h2>Inscription</h2>
        <form>
            <label for="nom"> Nom </label>
            <input type="text" id="nom" name="nom">
        <br>
        <br>
            <label for="prenom"> Prénom </label>
            <input type="text" id="prenom" name="prenom">
        <br>
        <br> 
            <label for="sexe"> Sexe </label> 
            &nbsp;      
            <input type="radio" id="feminin" checked>
            <label for="feminin"> Féminin </label>
            <input type="radio" id="masculin">
            <label for="masculin"> Masculin </label>
            <br>
            <br>
            <label for="date"> Date de naissance </label>
            <input type="date" id="date" name="date">
            <br>
            <br>
            <label for="niveau"> Niveau d'étude </label>
            <select id="niveau" name="niveau">
                <option value="3eme"> 3ème année Collège </option>
                <option value="2eme"> 2ème année Collège </option>
                <option value="1ere"> 1ère année Collège </option>
            </select>
            <br>
            <br>
            <label for="specialite"> Spécialité </label>
            <input type="text" id="specialite" name="specialite">
            <br>
            <br>
            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" name="telephone">
            <br>
            <br>
            <label for="email"> Email </label>
            <input type="email" id="email" name="email">
            <br>
            <br>
            <label for="site"> Site web personnel </label>
            <input type="text" id="site" name="site">
            <br>
            <br>
            <label for="adresse"> Adresse </label>
            <textarea id="adresse" name="adresse" rows="4"></textarea>
            <br>
            <br>
            <label for="photo"> Photo </label>
            <input type="file" id="photo" name="photo">
       </form>
    </div>
</body>
</html>
