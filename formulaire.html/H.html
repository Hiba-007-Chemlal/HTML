<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        nav ul {
            text-align: center;
            list-style: none;
            margin: 0 0 1% 0;
            padding: 0;
        }
        nav ul li {
            display: block;
            padding: 15px;
        }
        nav ul li a {
            color: #000;
            text-decoration: none;
            font-size: 20px;
            color: white;
            font-size: 18px;
        }
        .images img {
            width: 24%;
            text-align: center;
        }
        @media screen and (max-width:768px) {
            .images img {
                width:48%;
            }
        }
        nav {
            background: #000;
        }
        /* Mobile*/
        @media screen and (max-width:400px) {
            .images img {
                width:94%;
                margin-bottom: 1%;
            }
        }
        nav ul li:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li> <a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Blog</a></li>
        </ul>
    </nav>
    <div class="images">
       <img src="fleur.jpeg">
       <img src="fleur.jpeg">
       <img src="fleur.jpeg">
       <img src="fleur.jpeg">
    </div>
</body>
</html>
