<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>position</title>
<style>
  body {
    padding: 20px;
    height: 2000px;
    width: 2000px;
  }
  /* FIXED */
  .fixed{
    position: fixed;
    background: #ffcccc;
    padding: 20px;
    border-radius: 5px;
  }

  /* STICKY */
  .sticky{
    position: sticky;
    top: 0;
    background: #fff3cd;
    padding: 20px;
    border: 1px solid #daa520;
    width: 100%;
  }
</style>
</head>
<body>
<h2>Sticky</h2>
<div class="sticky">position: sticky</div>
<h2>fixed</h2>
<div class="fixed">position: fixed</div>
</body>
</html>
