<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - StageOFPPT</title>
<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0056b3,#0088ff);
}

.container{
    width:900px;
    min-height:500px;
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

/* Partie gauche */
.left-side{
    width:50%;
    background:#0056b3;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
    text-align:center;
}

.left-side h1{
    font-size:42px;
    margin-bottom:20px;
}

.left-side p{
    font-size:18px;
    line-height:1.8;
}

/* Partie droite */
.login-box{
    width:50%;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.login-box h2{
    text-align:center;
    color:#0056b3;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#0056b3;
}

button{
    width:100%;
    padding:14px;
    background:#0056b3;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#003f85;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    text-decoration:none;
    color:#0056b3;
    font-weight:bold;
}

/* Responsive */
@media(max-width:768px){

.container{
    flex-direction:column;
    width:95%;
}

.left-side,
.login-box{
    width:100%;
}

.left-side{
    padding:30px;
}

}
</style>
</head>
<body>

<div class="container">

    <div class="left-side">
        <h1>StageOFPPT</h1>
        <p>
            Trouvez votre stage idéal et connectez-vous
            aux meilleures entreprises partenaires.
        </p>
    </div>

    <div class="login-box">

        <h2>Connexion</h2>

        <form>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Entrer votre email">
            </div>

            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="Entrer votre mot de passe">
            </div>

            <button type="submit">Se connecter</button>

            <p class="register">
                Vous n'avez pas de compte ?
                <a href="inscription.html">S'inscrire</a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
