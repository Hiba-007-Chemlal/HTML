<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <title> Site Web </title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Ubuntu:ital@1&display=swap');
            *{
                font-family: 'Ubuntu', sans-serif;
                padding: 0;
                margin: 0;
            }
            a{
                color: white;
                text-decoration: none;
            }
            body{
                background-image: linear-gradient( to right,#01022d,black);
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items:center;
            }
            .container{
                background-image:
                  linear-gradient(to right,#01022de5 30%, rgba(0, 0, 0, 0)),
                  url(fleur.jpeg)
                  ;
                background-position: center;  
                width: 90%;
                height: 640px;
            }
            .container:hover{
                 background-image:
                  linear-gradient(to right, #01022de5 , transparent),
                  url(fleur.jpeg)
                  ;
            }
            header{
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
            }
            .logo{
                font-style: 30px;
                text-transform: uppercase;
            }
            ul{
                width: 60%;
                list-style: none;
                display: flex;
                justify-content: space-evenly;
            }
            ul a{
                border-bottom: 2px solid transparent;
            }
            ul a:hover{
                border-bottom-color: white;
            }
            .content{
                color: white;
                width: 50%;
                margin-top: 50px;
                padding: 30px;
            }
            .content h2{
                font-size: 100px;
                text-transform: uppercase;
            }
            .content p{
                letter-spacing: 3px;
                width: 350px;
                padding: 20px 0;
            }
            .content button{
                font-size: 30px;
                padding: 6px 10px;
                border-radius: 10px;
                border:2px solid transparent;
                cursor: pointer;
            }
            .content button:hover{
                background-color: transparent;
                border-color: white;
                color: white;
            }
    
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <a href="#" class="logo">avatar</a>
                <ul>
                    <li><a href="#">home</a></li>
                    <li><a href="#">clans</a></li>
                    <li><a href="#">vidéos</a></li>
                    <li><a href="#">photos</a></li>
                    <li><a href="#">about</a></li>
                </ul>
            </header>
            <div class="content">
                <h2>avatar</h2>
                <p> Lorem, ipsum dolor sit amet consectetur adipisicing elit. Corrupti ab debitis cum excepturi facere, at sed nemo ratione culpa in reiciendis praesentium, corporis tempore odit? Libero et commodi laboriosam alias.</p>
                <button>click here</button>
            </div>
        </div>
    </body>
</html>
